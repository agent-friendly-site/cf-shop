# agent-friendly-platform — Cloudflare Workers + D1 + R2.
# Phase 0 (2026-11-11): default deploy is `npx wrangler deploy`
# (after `npx wrangler login`). cf.py worker-put remains a fallback.
# This file is the source of bindings + cron for both deploy and
# local dev (`npx wrangler dev`).
name = "agent-friendly-platform"
# Phase 5: Vite + HonoX build output (npm run build → vite client + server).
main = "./dist/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
# Client build lands in dist/static; Worker is dist/index.js (excluded via .assetsignore).
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "agent-friendly-orders"
database_id = "dd3c36b4-a260-4fc5-9da2-b9b06ccfb1cc"
# Phase 2.3: drizzle-kit owns migrations (baseline in drizzle/).
# Hand-written 0001–0005 live in migrations/archive/ for history only.
migrations_dir = "drizzle"

# Payment-proof screenshots (v1.6.0, one-time upload link): private R2
# bucket, served only through the authenticated admin image endpoint.
# cf.py worker-put needs --r2-binding PROOFS:agent-friendly-proofs.
[[r2_buckets]]
binding = "PROOFS"
bucket_name = "agent-friendly-proofs"

# One trigger only: the account is on the Workers Free plan (5 cron
# triggers per account, already at the cap), so the daily 02:00
# trigger was replaced by the every-minute one. scheduled() runs
# both sweeps on every firing. wrangler deploy applies this block.
[triggers]
crons = ["* * * * *"]
